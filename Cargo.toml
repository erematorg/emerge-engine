[workspace]
members = ["."]

[package]
name = "emerge-engine"
version = "0.1.0"
edition = "2024"
authors = ["Eremat"]
license = "MIT OR Apache-2.0"
description = "Real-time MLS-MPM continuum physics engine — fluids, granular, elastic solids, active matter."
repository = "https://github.com/erematorg/emerge-engine"
readme = "README.md"
keywords = ["physics", "mpm", "simulation", "game", "continuum"]
categories = ["game-engines", "simulation", "science"]
# Internal design doc, not useful to crates.io consumers.
exclude = ["LP_MPM_SPEC.md"]

[dependencies]
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
rayon = "1"
# Arbitrary-length real FFT for `grid::dct`'s DCT-II/III -- the fluid
# pressure-projection solve's Poisson operator diagonalizes exactly in this
# basis, and the active-region bounding box (its own transform size) is not
# a power of two, so a general-N FFT is required. A well-established, widely
# used pure-Rust crate (Bluestein/mixed-radix internally), not a hand-rolled
# arbitrary-N FFT written under time pressure -- see `grid::dct`'s own doc.
rustfft = "6"
wgpu = { version = "27", optional = true, features = ["static-dxc"] }
# Real, optional dependencies of the LIBRARY (not dev-only) so `render::
# demo_harness` can be a real, general, published capability -- any
# consumer with `features=["render"]` gets a ready window+event-loop runner,
# not just this repo's own examples. Deliberately NOT the only way to use
# `Renderer`: LP (or anyone with their own event loop, e.g. Bevy) uses
# `Renderer` directly and never touches this harness -- purely additive,
# opt-in convenience, not a forced dependency of the core physics API
# (neither is pulled in without `render`).
winit = { version = "0.30", optional = true }
pollster = { version = "0.3", optional = true }

[features]
default = []
# GPU compute: wgpu pipeline, sparse active-block dispatch on grid_clear/
# grid_update, run every substep.
# Plasticity runs on GPU for every material except NACC, which is CPU-only
# (issue #5).
gpu = ["dep:wgpu"]
# Standalone debug renderer: instanced particle draw via wgpu, plus a real,
# optional window+event-loop runner (`render::demo_harness::run_demo`).
# Requires gpu.
render = ["gpu", "dep:winit", "dep:pollster"]
# Experimental physics modules: acoustics, EM, information theory.
# Not part of the guaranteed public API — no concrete LP use yet.
experimental = []

[dev-dependencies]
criterion = "0.5"
egui = "0.33.3"
egui-winit = "0.33.3"
egui-wgpu = "0.33.3"

[[bench]]
name = "scaling"
harness = false

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 3  # Full optimization for dependencies

[profile.release]
lto = "thin"
codegen-units = 1

